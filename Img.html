<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            width: 50px;
            height: 50px;
            background-image: linear-gradient(to right, #feb47b,rgb(231, 231, 133),rgb(159, 255, 159),skyblue,rgb(219, 160, 242),pink);
            border: 2px solid black;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 2px 2px 5px black;
        }
        img {
            width: 300px;
            height: 300px;
            box-shadow: 2px 2px 5px black;
        }
    </style>
</head>
<body>
    <img id="panda" src="img 2.jpg" alt="Panda" style="border: 2px solid black;border-radius: 20px;">
    <button type="button" onclick="changeImage()"></button>
    <script>
        function changeImage() {
            const imgElement = document.getElementById("panda");
            imgElement.src = "img1.jpg";
            imgElement.style.border="2px solid Black";
            imgElement.style.borderRadius="20px";
        }
    </script>
</body>
</html>
